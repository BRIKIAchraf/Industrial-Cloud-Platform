services:
  # MQTT Broker - Central messaging hub
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

  # Time Series Database - Storing telemetry
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=industrial_org
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
    volumes:
      - ./infra/influxdb/data:/var/lib/influxdb2
      - ./infra/influxdb/config:/etc/influxdb2

  # Relational Database - Storing device metadata & users
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=industrial_cloud
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data

  # OT Simulator - OPC-UA (Factory Lines)
  ot-simulator:
    build: 
      context: ./services/ot-simulator
      dockerfile: Dockerfile
    container_name: ot-simulator
    ports:
      - "4840:4840"
      - "5020:5020" # Modbus port
    depends_on:
      - mosquitto

  # Edge Gateway - Node-RED
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./infra/nodered/data:/data
    depends_on:
      - mosquitto

  # Industrial Dashboard - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=adminpassword
    volumes:
      - ./infra/grafana/data:/var/lib/grafana

  # Messaging & Streaming - Kafka
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_ANONYMOUS_LOGIN=yes
    depends_on:
      - zookeeper

  # Identity & Access Management - Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=adminpassword
    depends_on:
      - postgres

networks:
  default:
    name: industrial-network
